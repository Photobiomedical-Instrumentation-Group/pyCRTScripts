[tool.ruff]
target-version = "py39"
line-length = 88
indent-width = 4

exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]

select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    # "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    # "PL",    # pylint
    "RUF",   # Ruff-specific rules
]

ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic values
]

fixable = ["ALL"]

unfixable = []

preview = true

[tool.ruff.lint.per-file-ignores]

"__init__.py" = [
    "F401",
]

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88
