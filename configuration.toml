[Files]
plotPath = "Plots"
csvPath = "results_sheet.csv"
npzPath = "Npz"
provideXLSX = true
overwrite = false

[Video]
rescaleFactor = 0.5
livePlot = false  # Leave as false if using Windows
showEdgeDetection = false
showVideoFrames = false
playbackSpeed = "fast"

[Measurement]
roi = -1
channel = "g"
fromTime = 0
toTime = inf
sliceMethod = "from local max"
exclusionMethod = "first positive peak"
maxUncertaintyRatio = 0.1
initialGuesses = [1.0, -0.5, 0.0]

[ReleaseFrameDetection]
algorithm = "laplacian"
medianKernelRadius = 1
rescaleFactor = 0.5

[ReleaseFrameDetection.canny]
thresh1 = 47
thresh2 = 64
blurKernel = 5
l2grad = true
cannyPlateau = 8.261879165862927
cannySmoothingKernel = 1
cannyGradientSmoothingKernel = 3
indexOffset = 2

[ReleaseFrameDetection.laplacian]
scale = 1
delta = 0
ksize = 3
blurKernel = 8
laplacianPlateau = 1.7953339084618558
laplacianSmoothingKernel = 17
laplacianGradientSmoothingKernel = 5
indexOffset = -2

[AverageIntensitySlicing]
strictMinGrad = -1.829632093303938
strictMaxGrad = 1.9570490981053659
relaxMinGrad = -9.36934937254803
relaxMaxGrad = 9.634807412781452
offsetTime = 0.10563336383996912

[General]
askConfirmation = true
showAllPlots = true
showBGRPlot = true
showLABPlot = true
showEdgeDetectionPlot = true
writeLogFile = true
logLevel = "DEBUG"
